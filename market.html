<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriAssist AI - Market Prices</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8f3;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #2e7d32;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin-top: 8px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .season-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .season-box h2 {
            margin-top: 0;
            color: #2e7d32;
        }

        #season {
            width: 100%;
            max-width: 350px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .crop-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .crop-card:hover {
            transform: translateY(-5px);
        }

        .crop-card h3 {
            color: #2e7d32;
            margin-top: 0;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #1b5e20;
        }

        .season-tag {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 8px;
        }

        .note {
            color: #666;
            font-size: 13px;
            margin-top: 10px;
        }

        .back-btn {
            display: block;
            margin: 30px auto;
            padding: 12px 25px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .back-btn:hover {
            background: #1b5e20;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🌾 AgriAssist AI</h1>
        <p>Seasonal Vegetable Market Prices</p>
    </div>

    <div class="container">

        <div class="season-box">
            <h2>🌱 Select Season</h2>

            <select id="season">
                <option value="monsoon">🌧️ Monsoon</option>
                <option value="winter">❄️ Winter</option>
                <option value="summer">☀️ Summer</option>
            </select>
        </div>

        <h2 id="seasonTitle">🌧️ Monsoon Seasonal Vegetables</h2>

        <div id="marketList" class="market-grid"></div>

    </div>

    <button class="back-btn" onclick="window.location.href='homepage.html'">
        ← Back to Home
    </button>


    <script>

        const marketData = {

            monsoon: [
                {
                    name: "Cucumber",
                    emoji: "🥒",
                    price: "₹30 / kg"
                },
                {
                    name: "Bottle Gourd",
                    emoji: "🥬",
                    price: "₹35 / kg"
                },
                {
                    name: "Lady Finger",
                    emoji: "🌿",
                    price: "₹45 / kg"
                },
                {
                    name: "Bitter Gourd",
                    emoji: "🥒",
                    price: "₹50 / kg"
                },
                {
                    name: "Brinjal",
                    emoji: "🍆",
                    price: "₹40 / kg"
                },
                {
                    name: "Pumpkin",
                    emoji: "🎃",
                    price: "₹30 / kg"
                }
            ],

            winter: [
                {
                    name: "Carrot",
                    emoji: "🥕",
                    price: "₹45 / kg"
                },
                {
                    name: "Green Peas",
                    emoji: "🫛",
                    price: "₹80 / kg"
                },
                {
                    name: "Cauliflower",
                    emoji: "🥦",
                    price: "₹40 / kg"
                },
                {
                    name: "Radish",
                    emoji: "🌱",
                    price: "₹30 / kg"
                },
                {
                    name: "Spinach",
                    emoji: "🥬",
                    price: "₹25 / bunch"
                },
                {
                    name: "Cabbage",
                    emoji: "🥬",
                    price: "₹35 / kg"
                }
            ],

            summer: [
                {
                    name: "Tomato",
                    emoji: "🍅",
                    price: "₹40 / kg"
                },
                {
                    name: "Cucumber",
                    emoji: "🥒",
                    price: "₹35 / kg"
                },
                {
                    name: "Bottle Gourd",
                    emoji: "🥬",
                    price: "₹30 / kg"
                },
                {
                    name: "Bitter Gourd",
                    emoji: "🥒",
                    price: "₹45 / kg"
                },
                {
                    name: "Okra",
                    emoji: "🌿",
                    price: "₹50 / kg"
                },
                {
                    name: "Pumpkin",
                    emoji: "🎃",
                    price: "₹35 / kg"
                }
            ]
        };


        function showMarketPrices(season) {

            const marketList = document.getElementById("marketList");
            const seasonTitle = document.getElementById("seasonTitle");

            const seasonNames = {
                monsoon: "🌧️ Monsoon Seasonal Vegetables",
                winter: "❄️ Winter Seasonal Vegetables",
                summer: "☀️ Summer Seasonal Vegetables"
            };

            seasonTitle.textContent = seasonNames[season];

            marketList.innerHTML = "";

            marketData[season].forEach(crop => {

                const card = document.createElement("div");

                card.className = "crop-card";

                card.innerHTML = `
                    <h3>${crop.emoji} ${crop.name}</h3>

                    <div class="price">
                        ${crop.price}
                    </div>

                    <span class="season-tag">
                        ${season}
                    </span>

                    <div class="note">
                        Indicative market price
                    </div>
                `;

                marketList.appendChild(card);
            });
        }


        document.getElementById("season").addEventListener("change", function () {

            showMarketPrices(this.value);

        });


        // Default: Monsoon
        showMarketPrices("monsoon");

    </script>

</body>
</html>
